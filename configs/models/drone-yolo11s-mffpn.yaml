# MF-FPN + P2 reconstruction, constrained by the paper text and ablation table.
# Paper constraints:
#   1. remove the B5/downsampling stage;
#   2. add a 160x160 P2 head for 640x640 input;
#   3. remove the original 20x20 P5 detection head;
#   4. predict on P2/P3/P4.
nc: 10
scale: s
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                 # 0: P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1: P2/4
  - [-1, 2, C3k2, [256, false, 0.25]]         # 2: B2
  - [-1, 1, Conv, [256, 3, 2]]                # 3: P3/8
  - [-1, 2, C3k2, [512, false, 0.25]]         # 4: B3
  - [-1, 1, Conv, [512, 3, 2]]                # 5: P4/16
  - [-1, 2, C3k2, [512, true]]                # 6: B4 (B5 removed)
  - [-1, 1, SPPF, [512, 5]]                   # 7: retain context at the new deepest level
  - [-1, 2, C2PSA, [512]]                     # 8: retain YOLO11 attention at P4

head:
  # Top-down semantic propagation.
  - [-1, 1, nn.Upsample, [null, 2, nearest]]   # 9: P4 -> P3
  - [[-1, 4], 1, Concat, [1]]                 # 10
  - [-1, 2, C3k2, [256, false]]               # 11: top-down P3
  - [-1, 1, nn.Upsample, [null, 2, nearest]]   # 12: P3 -> P2
  - [[-1, 2], 1, Concat, [1]]                 # 13: fuse shallow B2/F1
  - [-1, 2, C3k2, [128, false]]               # 14: P2/4 small

  # Bottom-up geometric propagation.
  - [-1, 1, Conv, [128, 3, 2]]                # 15: P2 -> P3
  - [[-1, 11], 1, Concat, [1]]                # 16
  - [-1, 2, C3k2, [256, false]]               # 17: P3/8 medium
  - [-1, 1, Conv, [256, 3, 2]]                # 18: P3 -> P4
  - [[-1, 8], 1, Concat, [1]]                 # 19
  - [-1, 2, C3k2, [512, false]]               # 20: P4/16 large
  - [-1, 2, C3k2, [512, false]]               # 21: MF-FPN P4 refinement (parameter-constrained)
  - [[14, 17, 21], 1, Detect, [nc]]            # P2, P3, P4
