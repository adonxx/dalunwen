# Detection-scale ablation: retain the lightweight MF-FPN backbone/neck and
# predict on P2/P3/P4/P5. Compared with the current P2/P3/P4 model, this adds
# only a lightweight P5 branch after the refined P4 feature.
nc: 10
scale: s
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, false, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, true]]
  - [-1, 1, SPPF, [512, 5]]
  - [-1, 2, C2PSA, [512]]

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, false]]              # 11: P3 top-down
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, false]]              # 14: P2/4
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, false]]              # 17: P3/8
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, false]]
  - [-1, 2, C3k2, [512, false]]              # 21: refined P4/16
  - [-1, 1, Conv, [512, 3, 2]]               # 22: P4 -> P5
  - [-1, 2, C3k2, [512, false]]              # 23: lightweight P5/32
  - [[14, 17, 21, 23], 1, Detect, [nc]]       # P2, P3, P4, P5

