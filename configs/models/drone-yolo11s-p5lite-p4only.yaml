# Controlled P5-lite ablation: preserve the complete P2/P3 feature paths and
# apply semantic feedback only to the final P4 detection input.
nc: 10
scale: s
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                 # 0: P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1: P2/4
  - [-1, 2, C3k2, [256, false, 0.25]]         # 2: B2
  - [-1, 1, Conv, [256, 3, 2]]                # 3: P3/8
  - [-1, 2, C3k2, [512, false, 0.25]]         # 4: B3
  - [-1, 1, Conv, [512, 3, 2]]                # 5: P4/16
  - [-1, 2, C3k2, [512, true]]                # 6: B4
  - [-1, 1, SPPF, [512, 5]]                   # 7
  - [-1, 2, C2PSA, [512]]                     # 8

head:
  # The original MF-FPN top-down and bottom-up paths are unchanged.
  - [-1, 1, nn.Upsample, [null, 2, nearest]]   # 9: P4 -> P3
  - [[-1, 4], 1, Concat, [1]]                 # 10
  - [-1, 2, C3k2, [256, false]]               # 11: top-down P3
  - [-1, 1, nn.Upsample, [null, 2, nearest]]   # 12: P3 -> P2
  - [[-1, 2], 1, Concat, [1]]                 # 13
  - [-1, 2, C3k2, [128, false]]               # 14: final P2
  - [-1, 1, Conv, [128, 3, 2]]                # 15: P2 -> P3
  - [[-1, 11], 1, Concat, [1]]                # 16
  - [-1, 2, C3k2, [256, false]]               # 17: final P3
  - [-1, 1, Conv, [256, 3, 2]]                # 18: P3 -> P4
  - [[-1, 8], 1, Concat, [1]]                 # 19
  - [-1, 2, C3k2, [512, false]]               # 20
  - [-1, 2, C3k2, [512, false]]               # 21: final ungated P4

  # Generate P5-lite context only after P2/P3 have finished.  Only the P4
  # detection input sees this gate; P2 and P3 use layers 14 and 17 directly.
  - [-1, 1, P5LiteSpatialGate, [256, 128]]    # 22: P4-only feedback
  - [[14, 17, 22], 1, Detect, [nc]]           # P2, P3, gated P4
